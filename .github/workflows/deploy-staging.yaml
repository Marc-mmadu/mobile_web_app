name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  build-test-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest

    env:
      EMAIL_TO: mamahmarcus792@gmail.com

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: yarn install

    - name: Run Unit Tests (Vitest)
      run: yarn test:unit

    # Build the apps before running Cypress
    - name: Build the App (required before vite preview)
      run: yarn build
    # ⬆️ This was added to fix the Cypress E2E test failure due to missing build

    - name: Run Integration Tests (Cypress)
      run: yarn test:e2e

    - name: SSH to GCP VM and Deploy with Docker Compose
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /home/${{ secrets.STAGING_USER }}/mobile_web_app
          git pull origin staging
          
          # 🔧 CORRECTION: Ensure prometheus directory and file exist
          mkdir -p prometheus
          if [ ! -f prometheus/prometheus.yml ]; then
            echo "Creating default prometheus.yml"
            cat > prometheus/prometheus.yml << 'EOF'
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']
          EOF
          fi
          
          docker compose down
          docker compose up -d --build

    - name: Notify Team on Success
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "✅ MOBILE_WEB_APP: Deployment to Staging Successful"
        to: ${{ env.EMAIL_TO }}
        from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
        body: |
          The staging deployment succeeded and the application is live.

    - name: Notify Team on Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ MOBILE_WEB_APP: Deployment to Staging Failed"
        to: ${{ env.EMAIL_TO }}
        from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
        body: |
          Deployment to staging failed during one of the CI/CD steps. Please check the workflow logs.